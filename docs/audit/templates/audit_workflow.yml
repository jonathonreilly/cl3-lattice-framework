name: audit-lane

# Run the mechanical audit pipeline nightly on main, with a manual trigger for
# urgent refreshes. Pull requests are reviewed and landed through the
# repo-native review-loop, which already runs the pipeline and strict lint in a
# clean current-main worktree and strips generated audit outputs before landing.
#
# Drift-catching coverage:
#   - main: caught within 24 hours by the nightly cron (auto-commits refresh)
#   - manual: workflow_dispatch for urgent ad-hoc runs
#
# We deliberately do NOT trigger on every push to main, because:
#   (a) the auto-commit-back-to-main creates a feedback loop concern, and
#   (b) at hundreds of pushes/day the run count would be UI-noise excessive.
# The nightly cron keeps main refreshed. Review-loop is the landing gate:
# it must inspect the PR, rebase/salvage against moving main, regenerate the
# pipeline, and verify caches before landing.
#
# This workflow does NOT perform audits. Audit verdicts are minted only by
# the configured independent auditor via apply_audit.py.

on:
  schedule:
    - cron: "0 6 * * *"   # nightly 06:00 UTC pass on main
  workflow_dispatch:        # manual ad-hoc

permissions:
  contents: write          # required for auto-commit on cron runs

concurrency:
  group: audit-lane-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # full history so the citation graph builder can resolve all paths
          ssh-key: ${{ secrets.AUDIT_DEPLOY_KEY }}  # deploy key on the ruleset bypass list; GITHUB_TOKEN pushes are blocked by the main-branch PR gate

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt

      - name: Repair missing dependency edges
        run: python3 docs/audit/scripts/repair_missing_dependency_edges.py --apply

      - name: Report main-branch cache drift (warning only)
        run: |
          # Full-ledger freshness check on main. Emits a warning if
          # drift exists; the cron's refresh step below will fix it.
          if ! python3 scripts/precompute_audit_runners.py --all --check-only; then
            echo "::warning::Pre-existing cache drift on main; the nightly refresh below should clear it."
          fi

      - name: Run audit pipeline
        run: bash docs/audit/scripts/run_pipeline.sh

      - name: Regenerate conditional-prompt snapshot
        # MISSING_DERIVATION_PROMPTS.md is the static snapshot the
        # science-fix-loop reads. Without this refresh it drifts from the
        # live ledger, causing wasted attempts on rows that have already
        # been re-audited.
        run: python3 docs/audit/scripts/generate_conditional_prompts.py

      - name: Compute science-fix backlog surface
        # science_fix_backlog.json is the durable summary of every surface
        # the science-fix-loop can drain: applied non-clean verdicts,
        # archived-advisory defect reports that survive ledger-wide
        # invalidations, and evidence-repair rows grouped by gate family.
        # Runs after the pipeline so audit_queue.json exists. Summary only:
        # no verdict, no premise, no audit authority.
        run: python3 docs/audit/scripts/compute_science_fix_backlog.py

      - name: Commit refreshed ledger / queue
        run: |
          set -e
          git config user.name  "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            msg="audit: nightly repair and pipeline refresh (automated) [skip ci]"
          else
            msg="audit: workflow_dispatch repair and pipeline refresh (automated) [skip ci]"
          fi

          commit_if_needed() {
            if [[ -z "$(git status --porcelain docs)" ]]; then
              echo "No audit-data changes; nothing to commit."
              return 1
            fi
            git add docs
            if git diff --cached --quiet; then
              echo "No audit-data changes after staging; nothing to commit."
              return 1
            fi
            git commit -m "$msg"
          }

          commit_if_needed || exit 0

          # Race-condition safety: main may have moved while the audit
          # pipeline generated docs. Generated JSON/Markdown is not safe to
          # rebase through conflicts, so refresh from the latest origin/main
          # and rerun the deterministic repair/pipeline before retrying.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Push failed after $attempt attempts; aborting auto-commit."
              exit 1
            fi
            echo "Push attempt $attempt failed; regenerating from latest origin/main..."
            git fetch origin main
            git reset --hard origin/main
            python3 docs/audit/scripts/repair_missing_dependency_edges.py --apply
            bash docs/audit/scripts/run_pipeline.sh
            python3 docs/audit/scripts/generate_conditional_prompts.py
            python3 docs/audit/scripts/compute_science_fix_backlog.py
            commit_if_needed || exit 0
          done

      - name: Upload audit queue artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-queue-${{ github.run_id }}
          path: |
            docs/audit/data/audit_queue.json
            docs/audit/data/science_fix_backlog.json
            docs/audit/data/effective_status_summary.json
            docs/audit/data/cycle_inventory.json
            docs/repo/FRONT_DOOR_STATUS.md
          if-no-files-found: warn
          retention-days: 14

      - name: Print summary
        if: always()
        run: |
          if [ -f docs/audit/data/effective_status_summary.json ]; then
            python3 -c "
          import json
          s = json.load(open('docs/audit/data/effective_status_summary.json'))
          print('=== effective_status counts ===')
          for k, v in sorted(s.get('effective_status_counts', {}).items(), key=lambda x: -x[1]):
              print(f'  {k:50s} {v}')
          print()
          print(f'cycles detected: {s.get(\"cycles_detected\", \"?\")}')
          "
          fi
