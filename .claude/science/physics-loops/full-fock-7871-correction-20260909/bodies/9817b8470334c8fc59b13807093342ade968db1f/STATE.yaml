checkpoint_correction_no_ruling_no_totality: >
  OWNER CORRECTION (2026-07-29, live): the previous checkpoint's
  framing was WRONG twice. (1) Not a "ruling" — the existing axioms
  already say this; nothing was decided or added. (2) The supervisor's
  totality reading was a misreading: NOT every site gets a record;
  having a site — or admissible possibilities — does NOT force a
  record. "Records form" describes the resolution phenomenon (a record
  = a resolved possibility; when one forms it locks exactly one, at
  most one per site, permanent); formation itself is not obligatory.
  CORRECTED DISPOSITIONS: the #5753 suspected-independent proposal is
  WITHDRAWN (premise error — it assumed formation-totality); its four
  censuses stand as plain data. k=2 all-refused: NO axiom tension —
  a recordless lawful epoch is consistent; whether the fixture
  acceptance law's k=2 refusal is correct physics or a scope artifact
  is an open derivation question with no axiom-forced answer. k=3
  ties: which-resolves is probabilistic with possibly non-uniform
  weights — the open W6 derivation, as always. The occurrence-lane
  physics (formation rate, site distribution — the R-eta daylight)
  remains the open program it always was. NO new axiom; NO
  interpretation change; A_min untouched. The previous checkpoint,
  dossier 1b-RESOLVED, HANDOFF post-close update, and the #5753
  comment are superseded by this correction.

