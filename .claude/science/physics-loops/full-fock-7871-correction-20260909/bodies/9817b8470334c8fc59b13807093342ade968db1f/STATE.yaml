  that differes." INTERPRETATION FIXED: the Record axiom's "Records
  form" IS the resolution postulate (totality — no lawful situation
  resolves to nothing); definiteness (one per site) already explicit;
  records = resolved subset of possibility space; WHICH possibility
  resolves is a probability question with possibly non-uniform
