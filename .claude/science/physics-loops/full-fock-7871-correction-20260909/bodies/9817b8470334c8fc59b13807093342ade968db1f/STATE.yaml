  axioms are incomplete - but we need to prove the need for ADDITIONAL
  CLEAR axiom content to update them." CODIFIED as the three-leg
  axiom-update criterion: (1) REQUIREMENT — prove X is needed
  (internal consistency or a physical fact the TOE must reproduce);
  (2) NON-ENTAILMENT — the model-pair theorem: two completions, both
  satisfying all four axioms + the full retained surface (approved
  primitives, landed theorems, certificates), disagreeing on X. Route
